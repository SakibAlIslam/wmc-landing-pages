<!-- Holiday Insights category selector (FR) -->
<style>
  .wmc-holiday-insight-on-pagers,
  .wmc-holiday-insight-on-pagers *,
  .wmc-holiday-insight-on-pagers *::before,
  .wmc-holiday-insight-on-pagers *::after {
    box-sizing: border-box;
  }

  .wmc-holiday-insight-on-pagers {
    color: #041E42;
    font-family: inherit;
    width: 100%;
  }

  /* Category pills */
  .wmc-holiday-insight-on-pagers__pills {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin: 0 0 32px;
    padding: 0;
  }

  .wmc-holiday-insight-on-pagers__pill {
    -webkit-appearance: none;
    appearance: none;
    margin: 0;
    padding: 6px 18px;
    border: 1px solid #041E42;
    border-radius: 999px;
    background: #041E42;
    color: #FFFFFF;
    cursor: pointer;
    font-family: inherit;
    font-size: 16px;
    font-style: normal;
    font-weight: 700;
    line-height: 20px;
    text-align: center;
  }

  .wmc-holiday-insight-on-pagers__pill:hover {
    opacity: 0.88;
  }

  .wmc-holiday-insight-on-pagers__pill.is-active {
    background: #FFFFFF;
    color: #041E42;
    opacity: 1;
  }

  .wmc-holiday-insight-on-pagers__pill:focus-visible {
    outline: 2px solid #041E42;
    outline-offset: 2px;
  }

  /* Content card */
  .wmc-holiday-insight-on-pagers__card {
    display: grid;
    grid-template-columns: 4fr 5fr;
    gap: 24px;
    align-items: stretch;
  }

  .wmc-holiday-insight-on-pagers__media {
    margin: 0;
  }

  .wmc-holiday-insight-on-pagers__img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 444 / 292;
    object-fit: cover;
    border-radius: 24px;
  }

  .wmc-holiday-insight-on-pagers__body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 4px 0 8px;
  }

  .wmc-holiday-insight-on-pagers__title {
    margin: 0 0 8px;
    color: #041E42;
    font-size: 18px;
    font-style: normal;
    font-weight: 700;
    line-height: 24px;
  }

  .wmc-holiday-insight-on-pagers__desc {
    margin: 0;
    color: #041E42;
    font-size: 28px;
    font-style: normal;
    font-weight: 400;
    line-height: 34px;
  }

  .wmc-holiday-insight-on-pagers__link {
    align-self: flex-start;
    margin-top: 24px;
    color: #041E42;
    font-size: 16px;
    font-weight: 700;
    line-height: 20px;
    text-decoration-line: underline;
    text-decoration-style: solid;
    text-decoration-skip-ink: auto;
    text-decoration-thickness: auto;
    text-underline-offset: auto;
    text-underline-position: from-font;
  }

  .wmc-holiday-insight-on-pagers__link:focus-visible {
    outline: 2px solid #041E42;
    outline-offset: 2px;
  }

  /* Mobile: stack image above text and scale the headline down */
  @media (max-width: 767px) {
    .wmc-holiday-insight-on-pagers__pills {
      gap: 12px;
      margin-bottom: 24px;
    }

    .wmc-holiday-insight-on-pagers__pill {
      padding: 10px 18px;
    }

    .wmc-holiday-insight-on-pagers__card {
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .wmc-holiday-insight-on-pagers__desc {
      font-size: 22px;
      line-height: 28px;
    }

    .wmc-holiday-insight-on-pagers__link {
      margin-top: 16px;
    }
  }
</style>

<section class="wmc-holiday-insight-on-pagers" data-lang="fr" aria-label="Données sur les Fêtes par catégorie">
  <div class="wmc-holiday-insight-on-pagers__pills" role="group" aria-label="Catégories des données sur les Fêtes"></div>

  <div class="wmc-holiday-insight-on-pagers__card" aria-live="polite">
    <figure class="wmc-holiday-insight-on-pagers__media">
      <img class="wmc-holiday-insight-on-pagers__img" alt="">
    </figure>
    <div class="wmc-holiday-insight-on-pagers__body">
      <div>
        <p class="wmc-holiday-insight-on-pagers__title"></p>
        <p class="wmc-holiday-insight-on-pagers__desc"></p>
      </div>
      <a class="wmc-holiday-insight-on-pagers__link" href="#" target="_blank" rel="noopener"></a>
    </div>
  </div>
</section>

<script>
  (function () {
    "use strict";

    var IMG_BASE = "/content/dam/walmart-connect-canada/fr/images/pages/resources/Holiday-Insights-One-Pagers-2026/";
    var PDF_BASE = "/content/dam/walmart-connect-canada/fr/documents/pages/resources/Holiday-Insights-One-Pagers-2026/";
    var DEFAULT_ID = "apparel";

    // Order here is the order of the pills on the page
    var items = [
      {
        id: "apparel",
        pill: "Vêtements",
        title: "Vêtements",
        desc: "Consultez nos données pour en savoir plus sur les habitudes de recherche des consommateurs de vêtements durant les Fêtes.",
        cta: "Découvrir les données clés",
        img: "Apparel.png",
        pdf: "WMC_Holiday-Insights-Apparel_OnePager_2026_FR.pdf"
      },
      {
        id: "beauty",
        pill: "Produits de beauté",
        title: "Produits de beauté",
        desc: "Des essentiels de soins personnels aux produits de beauté, les clients sont à la recherche de ce qui leur convient parfaitement.",
        cta: "Explorer les données de la catégorie",
        img: "Beauty.png",
        pdf: "WMC_Holiday-Insights-Beauty_OnePager_2026_FR.pdf"
      },
      {
        id: "decor",
        pill: "Articles de decoration",
        title: "Articles de decoration",
        desc: "Ciblez les clients pendant qu’ils cherchent à créer des moments significatifs au moyen de cadeaux et d’articles de décoration bien pensés.",
        cta: "Découvrir les tendances et les comportements",
        img: "D%C3%A9cor.png",
        pdf: "WMC_Holiday-Insights-Decor_OnePager_2026_FR.pdf"
      },
      {
        id: "electronics",
        pill: "Articles électroniques",
        title: "Articles électroniques",
        desc: "Explorez les tendances de recherche liées aux articles électroniques au moment où les clients sont en quête de produits techno, de cadeaux et de mises à niveau pour les Fêtes.",
        cta: "Découvrir les tendances",
        img: "Electronics.png",
        pdf: "WMC_Holiday-Insights-Electronics_OnePager_2026_FR.pdf"
      },
      {
        id: "grocery",
        pill: "Produits d’épicerie",
        title: "Produits d’épicerie",
        desc: "Les activités de recherche et d’exploration s’intensifient alors que les acheteurs se préparent à recevoir leurs parents et amis autour de délicieux repas.",
        cta: "Explorer les données",
        img: "Grocery.png",
        pdf: "WMC_Holiday-Insights-Grocery_OnePager_2026_FR.pdf"
      },
      {
        id: "toys",
        pill: "Jouets",
        title: "Jouets",
        desc: "Des listes de souhaits aux cadeaux incontournables, découvrez les jouets recherchés par les clients pour les Fêtes.",
        cta: "Déballer les données",
        img: "Toys.png",
        pdf: "WMC_Holiday-Insights-Toys_OnePager_2026_FR.pdf"
      },
      {
        id: "pets",
        pill: "Animaux de compagnie",
        title: "Animaux de compagnie",
        desc: "Des listes de souhaits aux cadeaux incontournables, découvrez les jouets recherchés par les clients pour les Fêtes.",
        cta: "Découvrir les tendances",
        img: "Pets.png",
        pdf: "WMC_Holiday-Insights-Pets_OnePager_2026_FR.pdf"
      },
      {
        id: "pharmacy",
        pill: "Pharmacie",
        title: "Pharmacie",
        desc: "Découvrez ce que les clients de la pharmacie cherchent durant la période des Fêtes.",
        cta: "Explorer les données",
        img: "Pharmacy.png",
        pdf: "WMC_Holiday-Insights-Pharmacy_OnePager_2026_FR.pdf"
      },
      {
        id: "household",
        pill: "Produits ménagers",
        title: "Produits ménagers",
        desc: "Découvrez les habitudes de recherche des clients en ce qui concerne les produits ménagers qui leur permettront de célébrer les Fêtes dans la propreté.",
        cta: "Explorer les données clés",
        img: "Household%20Supplies.png",
        pdf: "WMC_Holiday-Insights-HouseholdSupplies_OnePager_2026_FR.pdf"
      }
    ];

    function init(root) {
      var pillsEl = root.querySelector(".wmc-holiday-insight-on-pagers__pills");
      var imgEl = root.querySelector(".wmc-holiday-insight-on-pagers__img");
      var titleEl = root.querySelector(".wmc-holiday-insight-on-pagers__title");
      var descEl = root.querySelector(".wmc-holiday-insight-on-pagers__desc");
      var linkEl = root.querySelector(".wmc-holiday-insight-on-pagers__link");
      var pills = {};

      // Build the pills from the data above
      items.forEach(function (item) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "wmc-holiday-insight-on-pagers__pill";
        btn.textContent = item.pill;
        btn.setAttribute("data-id", item.id);
        btn.setAttribute("aria-pressed", "false");
        pillsEl.appendChild(btn);
        pills[item.id] = btn;
      });

      // Swap the image, text and PDF link for the chosen category
      function select(id) {
        var item = null;
        items.forEach(function (i) {
          if (i.id === id) { item = i; }
        });
        if (!item) { return; }

        Object.keys(pills).forEach(function (key) {
          var isOn = key === id;
          pills[key].classList.toggle("is-active", isOn);
          pills[key].setAttribute("aria-pressed", isOn ? "true" : "false");
        });

        imgEl.src = IMG_BASE + item.img;
        titleEl.textContent = item.title;
        descEl.textContent = item.desc;
        linkEl.textContent = item.cta;
        linkEl.href = PDF_BASE + item.pdf;
      }

      pillsEl.addEventListener("click", function (e) {
        var btn = e.target.closest ? e.target.closest(".wmc-holiday-insight-on-pagers__pill") : null;
        if (btn && pillsEl.contains(btn)) {
          select(btn.getAttribute("data-id"));
        }
      });

      select(DEFAULT_ID);

      // Preload the other images so switching feels instant
      items.forEach(function (item) {
        var pre = new Image();
        pre.src = IMG_BASE + item.img;
      });
    }

    var roots = document.querySelectorAll('.wmc-holiday-insight-on-pagers[data-lang="fr"]');
    for (var i = 0; i < roots.length; i++) {
      init(roots[i]);
    }
  })();
</script>
